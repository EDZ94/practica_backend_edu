<div style="max-width: 400px; margin: 80px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: Arial, sans-serif;">
  <h2 style="text-align: center;">Iniciar Sesión</h2>

  <form (ngSubmit)="alEnviarFormulario()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Nombre de Usuario (Nick):</label>
      <input type="text" name="usuario" [(ngModel)]="usuarioInput" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Contraseña:</label>
      <input type="password" name="contrasena" [(ngModel)]="contrasenaInput" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div *ngIf="errorMensaje" style="color: red; background-color: #ffe6e6; padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center;">
      {{ errorMensaje }}
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">
      Entrar al Sistema
    </button>
  </form>
</div>
